  note: 兄弟。《新唐书》卷160 杨凭传明文「長善文辭，與弟凝、淩皆有名。大歷中，踵擢進士第，時號『三楊』」（维基文库逐字核录，2026-10-24）；杨凭大历四年、杨凝大历九年状元（传文不载科年与名次，凭「进士第一」据名录，凝状元据《登科记考》卷十一通说）。三弟杨凌亦进士但非状元。
