  note: 兄弟：同父张泚（苏州司马）。《旧唐书》卷162 张正甫传明文「初正甫兄式大厯中進士登第繼之以正甫，式子元夫傑夫徴夫又相次登科」（Kanripo 四库本 [162-18a] 逐字核录，2026-10-24）；行次（式兄、正甫弟）与科年（式大历七年 772、正甫贞元二年 786）据传文及《登科记考》通说。张氏兄弟状元，「元夫杰夫征夫又相次登科」为传文明文。
