  type: 亲属
  note: 儿女亲家（翁婿状元）：陆润庠长女嫁洪钧独子洪洛。据苏州地方志办公室《阊门陆氏：儒林儒医，状元世家》（2024，明载「陆润庠和洪钧亦称翁婿状元」）、Wikiwand 洪钧条（引《吴县志》等：光绪八年洪洛娶陆玉珍）。洪钧遗著《元史译文证补》由亲家陆润庠整理校订付梓。2026-10-24 入库。
