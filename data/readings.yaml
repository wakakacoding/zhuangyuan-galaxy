# r0004 依《宋史》卷418 文天祥传原文（Kanripo KR2a0032 四库本逐字核录）；r0005 依清史稿德宗本纪二与停罢科举诏；r0006 依《明史》卷192 已核引文 + 滇地著述年份的学术考据（成书年份注明「据学术考据，非本传明文」）。
- id: r0004
  person_id: z0416
  title: 文天祥：第一名之后
  summary: 宝祐四年进士第一。德祐起兵、臯亭山被拘、五坡岭被俘，至元十九年就义。逐段核到《宋史》卷418 原文。
  order: 4
  status: reviewed
  paragraphs:
    - text: 《宋史》卷418 传首写他「年二十舉進士，對䇿集英殿……其言萬餘不為藁一揮而成，帝親㧞為第一」，考官王應麟奏「是卷古誼若龜鑑，忠肝如鐵石」。这是宝祐四年，那年他二十岁。
      source_ids: [s0003]
    - text: 德祐初，「江上報急，詔天下勤王」，文天祥「捧詔涕泣」，以家貲充军费起兵万人入卫；宋降后「除樞密使，尋除右丞相兼樞密使，如軍中請和」，在臯亭山与元丞相伯颜抗论被拘。这些都在本传同一卷里，年份是德祐元年到二年（1275–1276）。
      source_ids: [s0003]
    - text: 被俘在祥兴元年（1278）冬：「天祥方飯五坡嶺，張弘範兵突至」，千户王惟义执之。他写了《过零丁洋》，末联「人生自古誰無死，留取丹心照汗青」也在本传里——弘范索书招降，他以这首诗作答。
      source_ids: [s0003]
    - text: 至元十九年（1282）「有閩僧言土星犯帝坐」，他「對曰：天祥受宋恩為宰相，安事二姓，願賜之一死足矣」，「南鄉拜而死」，年四十七。衣带中藏赞：「孔曰成仁，孟曰取義；惟其義盡，所以仁至。讀聖賢書，所學何事？而今而後，庶幾無媿。」
      source_ids: [s0003]
    - text: 就义日两处记载有差：本传只记至元十九年；「至元二十年正月」是通行纪年换算口径，本站深档从之。日期类差异照契约处理：传文优先，深档口径并注。
      source_ids: [s0003]
- id: r0005
  person_id: z0654
  title: 刘春霖：最后一科的第一人
  summary: 光绪三十年甲辰科殿试第一。《清史稿》本纪可证其科；停罢科举诏可证「最后一科」。卒年两说如实并注。
  order: 5
  status: reviewed
  paragraphs:
    - text: 《清史稿·德宗本纪二》光绪三十年五月：「癸卯，賜劉春霖等二百七十三人進士及第出身有差。」这是甲辰科殿试的本纪级记载。甲辰是恩科——同年皇太后七旬圣寿颁诏覃恩——他是这一科的第一人，授翰林院修撰。
      source_ids: [s0061]
    - text: 「最后一科」有上谕原文为证：光绪三十一年八月初四（1905 年 9 月 2 日），内阁奉谕「著即自丙午科為始，所有鄉會試一律停止，各省歲科考試亦即停止」。甲辰科因此成了科举史上最后一科殿试。
      source_ids: [s0060]
    - text: 沦陷期间拒附伪政权、书法「楷法冠当世」之誉，见本站深档记述（CBDB 及整理材料），本稿不重述为已核原文。卒年存两说：1942 与 1944——1944 年 1 月 18 日说是纪念类与部分辞书的通行记载，1942 年说有当时报纸报道；本站深档取 1942 标约年、注明存两说，两种说法都值得写下来，而不是替读者选一个。
      source_ids: [s0010]
- id: r0006
  person_id: z0497
  title: 杨慎：谪戍之后还写了什么
  summary: 谪滇期间的著述有了可注明的年份：《滇程记》等三书据学术考据成于嘉靖四五年间；《丹铅录》《廿一史弹词》不硬系年。
  order: 6
  status: reviewed
  paragraphs:
    - text: 《明史》卷192 本传：「明世記誦之博，著作之富，推慎為第一。詩文外，雜著至一百餘種，並行於世。」这句是总账，传里不注各书年份。
      source_ids: [s0034]
    - text: 谪滇头几年他写了一批滇地著作：《滇程记》记江陵至永昌沿途驿亭山川，学术考据系于嘉靖四年至六年（1525–1527）；《滇候记》《滇载记》也被考订在同一时期。注意：这些年份出自今人研究（明史与方志研究论文、人民日报「话说南丝路」专栏），不是本传明文，所以这里只说「据学术考据」，不当作传文明文引用。
      source_ids: [s0034]
    - text: 《丹铅录》系列与《廿一史弹词》是长期累积与晚年之作，各书内部无统一成书年，本稿不硬系年。能落到年份的落年份，落不了的照契约保留「未知」——这比编一张整齐的年表诚实。
      source_ids: [s0034]
