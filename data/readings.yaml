- id: r0001
  person_id: z0497
  title: 杨慎：殿试之后
  summary: 二十四岁殿试第一，十三年后因议礼被杖责，谪戍永昌。
  order: 1
  status: reviewed
  paragraphs:
    - text: 正德六年，杨慎二十四岁，殿试第一，授翰林院修撰。十三年后，他因为议礼，和廷臣一起跪在左顺门。
      source_ids: [s0034]
    - text: 《明史》本传说：嘉靖三年，世宗纳桂萼、张璁为翰林学士。杨慎与同列三十六人上言，称彼此学术不同，既然朝廷不听他们的话，他们不能与桂、张同列，愿被罢斥。世宗发怒，停了他们的俸。过了一个月，他又与学士丰熙等疏谏。不得命，便与廷臣伏在左顺门力谏。世宗把为首的八人下诏狱。杨慎和检讨王元正等撼门大哭，声彻殿庭。世宗更怒，全部下狱廷杖。十日后，又因有人说朝散之后是他们纠众伏哭，再杖七人。杨慎、王元正、刘济一并谪戍，杨慎到的是云南永昌卫。
      source_ids: [s0034]
    - text: 「国家养士百五十年，仗节死义，正在今日」这句话，《明史》记在卷一百九十一何孟春传里，出于修撰杨慎之口。它出现在众人决定跪门之前，是一句号召，不是跪在左顺门时的呼喊。
      source_ids: [s0035]
    - text: 本传又说，明世记诵之博、著作之富，推杨慎为第一；诗文之外，杂著至一百余种，并行于世。传里没有给这些著作标年份。嘉靖三十八年七月他去世，年七十二。追谥文宪在天启中。及第、力谏、杖责、谪戍和著述，都是记载里的事。记载没有写他此后是否自在，这里也不补。
      source_ids: [s0034]
- id: r0002
  person_id: z0650
  title: 张謇：第一人之后
  summary: 光绪二十年以第一人赐及第。笔记记他后来从事本省实业与教育，并两任总长。笔记未校对，不作年谱。
  order: 2
  status: reviewed
  paragraphs:
    - text: 光绪二十年四月，清廷赐张謇等三百一十一人进士及第、出身有差。《新世说》记他是这一科的第一人。登科之后，他没有只留在翰林院的记载里。
      source_ids: [s0036, s0037]
    - text: 《新世说》只说他「历年从事本省实业及教育」。大生纱厂与通州师范的年份、集股和「辞官」经过，这次没有核对到《啬翁自订年谱》原文，正文不写。
      source_ids: [s0037]
    - text: 同一则笔记记了后来两段官职：民国元年，南京政府任他为实业部总长；民国二年，熊内阁任他为农商总长。见到袁世凯要称帝，他辞职回乡。笔记只说到这里。
      source_ids: [s0037]
    - text: 胡适在 1929 年为张孝若《南通张季直先生传记》写的序里说：「张季直先生在近代中国史上是一个很伟大的失败的英雄。」这是序作者的话，不是年谱里的句子，也不是本站的结论。办厂、办学、做总长、辞职，各自是一段记载。哪一段更值得羡慕，页面不替他回答。
      source_ids: [s0038]
- id: r0003
  person_id: z0211
  title: 吕蒙正：第一名之后
  summary: 太平兴国二年进士第一，后来几次入相。高位也只是人生的一部分。
  order: 3
  status: reviewed
  paragraphs:
    - text: 吕蒙正是太平兴国二年的进士第一。第一名之后，他的官做到了很高的位置。这同样是一段人生，不必拿来和贬谪、归隐比较高下。
      source_ids: [s0039]
    - text: 《宋史》本传说：他擢进士第一，授将作监丞，通判升州。后来迁都官郎中，入为翰林学士，擢左谏议大夫、参知政事。李昉罢相，他拜中书侍郎兼户部尚书、平章事。淳化中曾罢，四年复入相。真宗咸平四年，又以本官同平章事。本传没有写「夺魁六年」「宋初罕见」。官品是本站按职官表推定的，传里没有这些数字。
      source_ids: [s0039]
    - text: 初入朝堂时，有朝士指着他说：「此子亦参政耶？」他装作没听见走了过去。同僚不平，要去问那人的姓名。他拦住说：「若一知其姓名，则终身不能忘，不若毋知之为愈也。」本传接着写「时皆服其量」。这是书里的记述，不是本站给他的性格结论。
      source_ids: [s0039]
    - text: 本传还记，赵普是开国元老，吕蒙正是后进，历官一纪，便与赵普同相位，赵普很推许他。他去世后赠中书令，谥文穆。高位写在传里，就按传写。它不表示这一生活得更圆满。
      source_ids: [s0039]
