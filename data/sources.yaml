- id: s0029
  title: 唐会要（宋·王溥）
  tier: A
  juan: 卷七十六（贡举下·制举科等）
  check: quoted
  url: https://zh.wikisource.org/wiki/%E5%94%90%E6%9C%83%E8%A6%81/%E5%8D%B7076
  quote: 卷76 制举科条：「永隆元年。岳牧舉。武陟縣尉員半千及第。上御武成殿親問曰……」；「三年。才堪經邦科。張九齡、康元懷及第」；「先天二年。文經邦國科。韓休及第……道侔伊呂科。張九齡及第」。
  note: 2026-10-24 核验（维基文库四库本卷76 全文）。覆盖：z0015 張九齡 才堪经邦科（神龙三年）与道侔伊吕科（先天二年）两条制举事件；兼及 z0004 員半千 岳牧举（永隆元年）。制举科目记载明确；張九齡「进士第一」之说本卷不载（其进士科第在卷76 贡举条无单列），夺魁断言仍依赖名录（B 级），与 dispute_note 口径一致。
