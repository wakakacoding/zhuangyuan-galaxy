- id: s0060
  title: 停罢科举诏（光绪三十一年八月初四日上谕）
  author: 清·光绪帝
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E5%81%9C%E7%BD%B7%E7%A7%91%E8%88%89%E8%A9%94
  quote: 著即自丙午科为始，所有乡会试一律停止，各省岁科考试亦即停止。
  note: 1905 年 9 月 2 日（光绪三十一年八月初四日）内阁奉上谕，袁世凯等奏请立停科举。光绪三十年甲辰科因此成为科举史上最后一科殿试。2026-10-24 核验（维基文库全文）。
- id: s0061
  title: 清史稿·德宗本纪二
  juan: 卷二十四
  tier: A
  check: quoted
  url: https://www.moshuyuan.com/chapter/shibu/qing-shi-gao/ben-ji-er-shi-si-de.html
  quote: 三十年甲辰……五月……癸卯，赐刘春霖等二百七十三人进士及第出身有差。
  note: 光绪三十年（1904）甲辰科殿试授职的本纪级记载；「甲辰恩科」的「恩科」表述出自太后七旬圣寿覃恩 context，本传不写恩科二字。2026-10-24 核验。
