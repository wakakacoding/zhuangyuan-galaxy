# 史料出处表：tier A=正史/题名碑/朱卷/登科录（一手）；A-=权威学术编纂/辑佚汇考（非一手，但为该领域整理基准，如《登科记考》；2026-10-23 T02 D1 裁定增设）；B=地方志/年谱/日记/整理名录；C=笔记小说/民间传说
- id: s0001
  title: 登科记考
  author: 清·徐松
  tier: A-
  note: 唐五代科举史料集大成。系清人辑佚汇编而非一手档案，2026-10-23 T02 D1 裁定由 A 改定 A-（学术编纂）；承载 11 名唐五代人物的夺魁（原 8 人 + 王朴、扈载、崔元翰改挂）与 18 条关系边。卷次框架已核实：全书 30 卷，按帝世编排——唐高祖至太宗卷1、武宗至宣宗卷22、昭宗至昭宣帝卷24、后梁太祖至后唐卷25、后晋至后周卷26、附考卷27、别录卷28–30（中华书局 2019《登科记考补正》目录）。逐人页码/引文仍待点校本或可靠在线本（ctext 南菁书院本 OCR 质量差且反爬；维基文库无此书），补齐前 check 保持 unverified。
- id: s0002
  title: 明清进士题名碑录
  tier: A
  check: located
  note: 据北京国子监进士题名碑整理，姓名籍贯名次一手证据。检索路径已核实（2026-10-24）：① 孔庙和国子监博物馆《明清进士题名碑知识图谱》微信小程序——以《明清进士题名碑录索引》为核心建库，可按姓名/科第/籍贯/碑刻编号检索，含高清拓片；② ctext《太學進士題名碑錄》（清·李周望、孙嘉淦，ctp:wb898307，OCR，按科次分节，覆盖顺治至乾隆二年及明代洪武至万历三十八年）可作纸本替代源，OCR 误差须以扫描页核对。z0526 赵秉忠（万历二十六年戊戌科）等 8 名明清人物的碑录定位取 ctext 分节页码+小程序核对后可升 quoted；纸质《明清进士题名碑录索引》（上海古籍 1980，全三册）仍为最终依据。
- id: s0003
  title: 宋史
  tier: A
  juan: 卷四百一十八（文天祥）；卷三百一十（李迪、王曾）
  check: quoted
  url: https://zh.wikisource.org/wiki/宋史/卷418
  quote: 卷418：「年二十舉進士，對策集英殿……帝親拔為第一」（文天祥）；卷310：「舉進士第一」（李迪）、「由鄉貢試禮部、廷對皆第一」（王曾）。
  note: 整书级引用不得单独支撑断言，逐人卷次以本条所列已核处为准（2026-10-19 T02 核验，2026-10-23 落库）；其余挂本书的人物仍按未核计。
- id: s0004
  title: 明史
  tier: A
  juan: 卷一百七十六（商辂、彭时）；卷一百四十三（黄观有传）
  check: quoted
  url: https://zh.wikisource.org/wiki/明史/卷176
  quote: 卷176：「舉鄕試第一。正統十年，會試、殿試皆第一。終明之世，三試第一者，輅一人而已」（商辂）；「正統十三年進士第一」（彭时）。
  note: 卷143 目录列黄观传。整书级引用不得单独支撑断言（T02 核验，2026-10-23 落库）。
- id: s0005
  title: 清史稿
  tier: A
  juan: 卷三百三十二（毕沅）
  check: quoted
  url: https://zh.wikisource.org/wiki/清史稿/卷332
  quote: 卷332：「二十五年一甲一名進士，授修撰」（毕沅，乾隆二十五年）。
  note: 整书级引用不得单独支撑断言（T02 核验，2026-10-23 落库）。
- id: s0006
  title: 旧唐书
  tier: A
  juan: 卷九十三（娄师德）；卷一百九十下（王维）；卷七十五（孙伏伽）；卷一百四十九（归崇敬附归登、归融）
  check: quoted
  url: https://zh.wikisource.org/wiki/舊唐書/卷93
  quote: 卷93：「弱冠，進士擢第，授江都尉」（娄师德）；卷190下：「維開元九年進士擢第」（王维）。卷75 孙伏伽传全篇无进士记载（只记大业末为万年县法曹、武德元年上谏）。
  note: 原文只支持「进士及第」，不支持娄师德、王维、孙伏伽任何一人的「第一」；三人夺魁断言的处置见各自档案与争议登记（T02 核验，2026-10-23 落库）。
- id: s0007
  title: 新唐书
  tier: A
  juan: 卷一百二十二（郭元振）；卷一百六十（杨凭附杨凝）
  check: quoted
  url: https://zh.wikisource.org/wiki/新唐書/卷122
  quote: 卷122：「十八舉進士，為通泉尉」（郭元振）。卷160 杨凭传：「長善文辭，與弟凝、淩皆有名。大歷中，踵擢進士第，時號『三楊』」。
  note: 只支持十八岁进士及第，不支持「高第」或「第一」（T02 核验，2026-10-23 落库）。
- id: s0008
  title: 金史
