  juan: 卷一百二十五（胡砺）
  check: quoted
  url: https://zh.wikisource.org/wiki/金史/卷125
  quote: 卷125：「十年，舉進士第一，授右拾遺」（胡砺，天会十年）。
  note: T02 核验，2026-10-23 落库。
- id: s0009
  title: 元史
  tier: A
  juan: 卷一百四十三（泰不华）；卷一百五十三（杨奂）
  check: quoted
  url: https://zh.wikisource.org/wiki/元史/卷143
  quote: 卷143：「年十七，江浙鄉試第一。明年，對策大廷，賜進士及第」（泰不华）；卷153：「奐試東平，兩中賦論第一」（杨奂）。
  note: 卷143 只支持泰不华一甲及第，不支持「右榜第一」；杨奂「第一」为东平道赋论第一，非全国状元（T02 核验，2026-10-23 落库）。
