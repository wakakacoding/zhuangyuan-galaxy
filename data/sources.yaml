  note: 此句在号召伏阙之前，不是跪左顺门时的呼喊。
- id: s0036
  title: 清史稿·德宗本纪
  juan: 卷二十三
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E6%B8%85%E5%8F%B2%E7%A8%BF/%E5%8D%B723
  quote: 夏四月……辛未，赐张謇等三百十一人进士及第出身有差。
  note: 光绪二十年。本条未写授何官。
- id: s0037
  title: 新世说·言语
  author: 易宗夔
  juan: 卷一
  tier: C
  check: quoted
  url: https://zh.wikisource.org/wiki/%E6%96%B0%E4%B8%96%E8%AA%AA/01
  quote: 张名謇，江苏通州人。光绪甲午，以第一人赐及第。历年从事本省实业及教育。民国元年，南京政府任君为实业部总长。二年，熊内阁任君为农商部总长。见袁氏欲称帝，即辞职旋里云。
  note: 维基文库页标明尚未校对。笔记，不作张謇自述。
- id: s0038
  title: 《南通张季直先生传记》序
  author: 胡适
  tier: C
  check: quoted
  url: https://zh.wikisource.org/wiki/%E3%80%8A%E5%8D%97%E9%80%9A%E5%BC%B5%E5%AD%A3%E7%9B%B4%E5%85%88%E7%94%9F%E5%82%B3%E8%A8%98%E3%80%8B%E5%BA%8F
  quote: 张季直先生在近代中国史上是一个很伟大的失败的英雄，这是谁都不能否认的。
  note: 1929 年为张孝若《传记》所作序，是后人评价，不是《啬翁自订年谱》的记载。
- id: s0039
  title: 宋史·吕蒙正传
  juan: 卷二百六十五
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E5%AE%8B%E5%8F%B2/%E5%8D%B7265
  quote: 蒙正，太平兴国二年擢进士第一，授将作监丞，通判升州。
  note: 文渊阁四库本「升」作「昇」。参知政事、平章事及朝堂不记姓名之语均在本传。
- id: s0040
  title: 新唐书·杨元琰传附杨仲昌
  juan: 卷一百二十
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E6%96%B0%E5%94%90%E6%9B%B8/%E5%8D%B7120
  quote: 子仲昌，字蔓。以通经为修文生。累调，不甚显。以河阳尉对策，玄宗擢第一，授蒲州法曹参军，判入异等，迁监察御史。坐累为孝义令。鸾降庭树，太守萧恕表其政，徙下邽。终吏部郎中。
  note: 制举第一，不是进士科状元。父杨元琰，虢州阌乡人。
- id: s0041
  title: 新唐书·文艺·常衮传附常无名
