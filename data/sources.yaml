- id: s0042
  title: 叔父故礼部员外郎墓志铭
  author: 唐·常衮
  tier: A
  check: located
  url: https://zh.wikisource.org/wiki/%E5%85%A8%E5%94%90%E6%96%87/%E5%8D%B70420
  quote: ""
  note: 常衮为其伯常无名所作，收《全唐文》卷 420。记河内温人、历鄠县尉、起居舍人、屯田员外郎、礼部员外郎，天宝三载卒，年五十六。本轮用的是转述，未逐字核录。
- id: s0043
  title: 唐故河南府洛阳县尉顿丘李公墓志铭并序
  author: 唐·张阶
  tier: A
  check: located
  quote: 洎开元廿二载，尚书考功郎孙公以武库诗备题，候群子之去就。公含毫有得，词理甚鲜。遂以乡贡进士擢第。朝廷命天官举博学宏词，公其裒然。明年授秘书省校书郎，转右骁卫仓曹参军，河南府洛阳县尉。视事再岁而终。
  note: 张阶序，韩液篆铭，蔡希寂书。原石今藏苏州，录文见《曲石精庐藏唐墓志》。录文只写「乡贡进士擢第」与同年再举博学宏词，「状元」「第一」是后人据名次传统所加，本档不写死。引文据公开录文摘抄，个别字有残泐。
- id: s0044
  title: 新唐书·宰相世系表·赵郡李氏
  juan: 卷七十二下
  tier: A
  check: located
  url: https://zh.wikisource.org/wiki/%E6%96%B0%E5%94%90%E6%9B%B8/%E5%8D%B7072%E4%B8%8B
  quote: ""
  note: 表中有李嶷，官右武卫录事参军。只证籍贯与官终，不证科第名次。
- id: s0045
  title: 唐才子传·王昌龄
  author: 元·辛文房
  juan: 卷二
  tier: B
  check: located
  quote: ""
  note: 记王昌龄为开元十五年李嶷榜进士。这是李嶷科第名次的唯一依据，后出文献。
- id: s0046
  title: 新唐书·文艺·苏源明传附梁肃
  juan: 卷二百二
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E6%96%B0%E5%94%90%E6%9B%B8/%E5%8D%B7202
  quote: 肃，字敬之，一字宽中。隋刑部尚书毗五世孙，世居陆浑。建中初，中文辞清丽科，擢太子校书郎。萧复荐其材，授右拾遗，修史，以母羸老不赴。杜佑辟淮南掌书记，召为监察御史，转右补阙、翰林学士、皇太子诸王侍读。卒，年四十一，赠礼部郎中。
  note: 文辞清丽科是制科，不是进士科。本传只言建中初，不记具体年份，也不记名次。
- id: s0047
  title: 旧唐书·齐映传
  juan: 卷一百三十六
  tier: A
  check: located
  quote: 齐映，瀛州高阳人。映登进士第，应博学宏辞，授河南府参军。滑亳节度使令狐彰辟为掌书记，累授监察御史。彰疾甚，映草遗表，因与谋后事，映说彰令上表请代，令子建归京师，彰皆从之，因妻以女。贞元十一年七月卒，时年四十八。赠礼部尚书。
  note: 本传只写登进士第，不写名次，也不写科年。名录的大历四年状元是后世名单所加。
- id: s0048
  title: 旧唐书·常衮传
  juan: 卷一百一十九
  tier: A
  check: located
  quote: 常衮，京兆人也。衮，天宝末举进士，历太子正字。建中四年正月卒，时年五十五。
  note: 本传只言天宝末，不写具体年份，也不写名次。名录系于天宝十四载，是后世名单。
- id: s0049
  title: 旧唐书·萧遘传
  juan: 卷一百七十九
  tier: A
  check: located
  quote: 萧遘，兰陵人。以咸通五年登进士第，释褐秘书省校书郎、太原从事。
  note: 科年是咸通五年（864）。名录作永泰元年（765），来自徐松《登科记考》的存疑附年，不采用。
- id: s0050
  title: 新唐书·萧遘传
  juan: 卷一百一
  tier: A
  check: located
  quote: 始，王铎主贡举而得遘，及是，与铎并位。遘曰：不止以长，乃铎门生。
  note: 萧遘自述为王铎门生，座主关系以此为据。
- id: s0051
  title: 两唐书·白敏中李固言张又新徐晦传
  tier: A
  check: located
  quote: 敏中字用晦，少孤，承学诸兄。长庆初第进士。
  note: 新唐书卷 119 白居易传附白敏中，旧唐书卷 173 李固言传、卷 149 张又新传、卷 165 徐晦传。四处都只写及第，不写名次。白敏中第一名另有贺拔惎一说。
- id: s0052
  title: 两唐书·孔纬陆扆崔昭纬传
  tier: A
  check: located
  quote: ""
  note: 旧唐书卷 179、新唐书卷 163 与卷 183。三人本传都记及第，不写名次。
- id: s0053
  title: 唐摭言
  author: 五代·王定保
  juan: 卷二
  tier: B
  check: located
  quote: ""
  note: 记卢肇为宜春人，会昌三年进士第一，主考王起。后出文献，没有第二处佐证。
- id: s0054
  title: 南唐书与十国春秋
  tier: B
  check: located
  quote: ""
  note: 马令、陆游两部南唐书记伍乔，清人十国春秋记梁嵩。都不是当代档案，名次只取这一层。
