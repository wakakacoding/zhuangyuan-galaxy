  title: 明史·杨慎传
  juan: 卷一百九十二
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E6%98%8E%E5%8F%B2/%E5%8D%B7192
  quote: 年二十四，举正德六年殿试第一，授翰林修撰。嘉靖三十八年七月卒，年七十有二。天启中，追谥文宪。明世记诵之博，著作之富，推慎为第一。诗文外，杂著至一百余种，并行于世。
  note: LIFE-04 专条。哭谏引语不在本传。
- id: s0035
  title: 明史·何孟春传
  juan: 卷一百九十一
  tier: A
  check: quoted
  url: https://zh.wikisource.org/wiki/%E6%98%8E%E5%8F%B2/%E5%8D%B7191
