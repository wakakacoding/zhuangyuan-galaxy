id: z0147
name: 赵昌翰
dynasty: tang
exam_year: 887
reign: 光啟三年丁未科
native_hist: 奉天（今陝西乾縣）
native_modern: 陕西省咸阳市乾县
ke_ci: 光启三年丁未科
bio_short: 奉天赵氏三状元之三，状元赵蒙之子——父子状元隔代辉映。光启三年丁未科进士第一，同榜有诗人郑谷。后官考功郎中，钱珝所撰制文称「以名家子，实自修整」——公卿满门而不走门路，是晚唐清流门风的写照。此后史籍「余事不详」。
tags:
  - 奉天赵氏
  - 父子状元
events:
  - year: 887
    type: 夺魁
    title: 光启三年丁未科状元
    description: 僖宗光启三年进士第一，上距其父赵蒙大中九年夺魁三十二年。同榜进士郑谷，此前困顿科场十六年，此榜及第后为晚唐名诗人。
    source_id: s0001
  - year_label: 昭宗年间
    precision: range
    type: 升迁
    title: 授考功郎中
    description: 钱珝《授赵昌翰考功郎中制》（《全唐文》卷八三一）：「昌翰以名家子，实自修整……为县罢去，翛然自安。公卿有知己之门，车马无致身之迹。」——世家子弟而不事钻营，授掌官员考课的考功郎中。
    office: 考功郎中
    rank_grade: 5.5
    estimated: true
    source_id: s0026
  - year_label: 其后
