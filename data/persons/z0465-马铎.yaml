ke_ci: 永乐十年壬辰科
bio_short: 永乐十年状元，长乐「一母两状元」之兄。替人放羊时趴私塾窗旁听，无师自通人称「马五经」；四十五岁夺魁，成祖亲试对联「白扇画梅，日日迎风花不动——青鞋绣菊，朝朝踢露蕊难开」，叹「真状元之才」。两度受命「代驾郊天」替皇帝祭天地，世称「马铎一日君」。
tags:
