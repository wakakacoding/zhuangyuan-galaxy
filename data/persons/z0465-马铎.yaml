events:
  - year: 1412
    type: 夺魁
    title: 永乐十年壬辰科状元
    description: 早年父丧家贫，为人放羊，过私塾辄伏窗旁听，遂通《诗》《书》，人号「马五经」。四十五岁夺魁，成祖亲览试卷赞其文「气象广大」。本名马乐，避永乐讳改名马铎。
    source_id: s0033
  - year_label: 夺魁时
    precision: range
    type: 轶事
    title: 御前对句，「真状元之才」
    description: 成祖持白扇画梅出上联「白扇画梅，日日迎风花不动」，马铎即对「青鞋绣菊，朝朝踢露蕊难开」；又指殿外铃儿草「风吹不响铃儿草」，随口对「雨打无声鼓子花」。成祖连声赞赏。
    source_id: s0033
  - year_label: 永乐年间
    precision: range
    type: 轶事
    title: 「代驾郊天」，一日为君
    description: 成祖两度出京巡幸，皆命马铎留京监国、代驾郊天——作为皇帝替身祭祀天地，做了「一日君」，此事在长乐传诵六百年。后治理黄河、平息边关，文可服众、武能安邦。
    source_id: s0033
  - year: 1423
    type: 卒
    title: 永乐二十一年卒于任
    description: 耿直磊落、生活简朴，深得军民爱戴。其同母异父弟李騏，六年后（1418）亦中状元——「一母两状元」传为千古佳话。有《梅岩集》。
    source_id: s0033
