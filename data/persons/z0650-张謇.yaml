name: 张謇
zi: 季直
hao: 啬庵
dynasty: qing
exam_year: 1894
reign: 光绪
birth_year: 1853
death_year: 1926
native_hist: 江苏省通州直隶州
native_modern: 江苏省南通市
ke_ci: 光绪二十年甲午恩科
bio_short: 光绪二十年以第一人赐及第。此后在通州办实业、办教育；民国元年任南京政府实业部总长，二年任熊内阁农商总长。
tags:
  - 实业家
  - 教育家
  - 立宪派
events:
  - year: 1894
    type: 夺魁
    title: 光绪二十年以第一人赐及第
    description: 《清史稿·德宗本纪》记是年四月赐张謇等进士及第出身有差；《新世说》记其光绪甲午以第一人赐及第。授翰林院修撰与四十一岁，本步所核出处未写明。
    source_id: s0036
    evidence: primary
  - year: 1895
    type: 实业
    title: 筹划通州纱厂
    description: 后人整理称，署两江总督张之洞委其总理通海一带商务，筹办大生纱厂，集股艰难，后以搁置官机作价入股。本步未核到《啬翁自订年谱》原文，故不挂年谱出处，也不写「辞官」。
    evidence: pending
  - year: 1902
    type: 实业
    title: 筹划通州师范
    description: 后人整理称，光绪二十八年他应刘坤一之邀讨论兴学，地方官阻挠后与同人筹划在通州自立师范。本步未核到年谱原文，故不挂年谱出处，也不写「中国最早」。
    evidence: pending
  - year: 1912
    type: 授官
    title: 任南京政府实业部总长
    description: 《新世说》记民国元年南京政府任其为实业部总长。
    source_id: s0037
    evidence: secondary
  - year: 1913
    type: 授官
    title: 任熊内阁农商总长
    description: 《新世说》记民国二年熊内阁任其为农商总长，见袁世凯欲称帝，即辞职旋里。
    source_id: s0037
    evidence: secondary
  - year: 1926
    type: 卒
    title: 卒
    description: 卒年取通行传记。胡适「很伟大的失败的英雄」是 1929 年序文里的评价，不是年谱所记。
    source_id: s0038
    evidence: secondary
