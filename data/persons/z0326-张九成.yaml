bio_short: 其先开封人，徙钱塘。绍兴二年进士第一。授镇东军签判。累迁礼部侍郎兼侍讲。因不肯附秦桧，谪邵州，又贬南安军十四年。桧死后起知温州。卒年六十八，后赠太师，谥文忠。
