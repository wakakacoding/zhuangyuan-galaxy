  - 元好问撰碑
events:
  - year_label: 金正大年间
    precision: range
    type: 轶事
    title: 屡试不中，《万言策》斥时弊
    description: 乾州奉天人，书香门第。金末屡试不第，慨然作《万言策》指斥时弊，辞旨痛切，经友人劝阻未上；归乡讲学，终南山下建紫阳阁，弟子百余，植柳千株号「柳塘」。
    source_id: s0032
  - year: 1233
    type: 轶事
    title: 汴京之变，微服北渡
    description: 天兴二年金将崔立以汴京降蒙古，杨奂微服北渡黄河，投冠氏县赵天锡，赵以师友之礼相待。东平大军阀严实多次相邀，杨奂珍视与赵天锡之谊，终未往。
    source_id: s0032
  - year: 1238
    type: 夺魁
    title: 戊戌选试，东平道进士第一
    description: 元太宗十年「戊戌选试」，杨奂应试东平路，赋、论两中第一，随监试官北上燕京谒耶律楚材。楚材奏荐为河南路征收课税所长官兼廉访使。
    source_id: s0009
  - year_label: 1238 年后
    precision: range
    type: 升迁
    title: 主政河南，减税四分之一
    description: 赴任前对耶律楚材言：河南兵荒之后遗民无几，急治必致民怨，愿宽以时日。到任召集贤达共商治理，有人提议增税，不但不纳，反将原定税额削减四分之一，政通令行。
    office: 河南路征收课税所长官兼廉访使
    rank_grade: 4.5
    estimated: true
    source_id: s0032
  - year: 1255
    type: 卒
    title: 宪宗五年卒，年七十
    description: 壬子年（1252）被驿召入关，参议京兆宣抚司事；后请闲居乡郡，筑「归来堂」佚老。乙卯九月病革，处置后事明了如平时，引觞大噱、望东南注香，命门生录留诗三章，恬然而逝。谥文宪。著《正统书》六十卷、《还山集》。
    source_id: s0032
