    title: 天顺元年丁丑科状元
    description: 少自负，二月四日抵京赴会试，主司拒之曰「少，汝作状元耶？」淳应声曰「此亦在吾辈耳」。至邸见壁题「昨夜檐前乾鹊噪，声声报道状元来」，后果夺魁，年三十四。
