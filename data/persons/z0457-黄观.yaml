  - year: 1402
    type: 卒
    title: 靖难之役投江殉国
    description: 燕王入南京，黄观时在长江上游募兵，闻变投江殉建文帝，妻女亦殉。朱棣登极后削其状元名籍，时人以讳故不敢称之。
    source_id: s0004
