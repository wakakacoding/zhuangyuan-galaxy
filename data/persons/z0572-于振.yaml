events:
  - year: 1723
    type: 夺魁
    title: 雍正元年癸卯恩科状元
    description: 雍正帝登极特设恩科，于振为首科状元。除依例授翰林院修撰外，特以修撰衔入值南书房，恩遇有加。雍正二年主考河南乡试，三年赐居澄怀园，五年出任湖广学政。
    source_id: s0005
  - year_label: 雍正五年后
    precision: range
    type: 贬谪
    title: 擅增学额，贬为庶人
    description: 督察湖北（湖广）学政期间擅自增添学额两名，遭参黜，贬为庶人——从天子门生到白身，一落千丈。
    source_id: s0005
  - year_label: 三年后
    precision: circa
    type: 升迁
    title: 由秀才重考举人，东山再起
    description: 生平学问无所不窥、研学精细，被贬三年后重新由秀才考取举人，调任行人司司副——科举正途再走一遍，骨气可敬。
    source_id: s0005
  - year: 1750
    type: 卒
    title: 约乾隆十五年卒
    description: 族弟于敏中乾隆二年（1737）状元，官至文华殿大学士、军机大臣——金坛于氏兄弟状元，一沉一显。
    source_id: s0018
