ke_ci: 大中十三年进士
bio_short: 曲阜人，孔子后裔。少年丧父，依叔父。大中十三年进士及第。累迁翰林学士知制诰。僖宗幸蜀，从驾。光启二年拜相，封鲁国公。乾宁二年卒于相位，赠太尉。
