ke_ci: 咸丰六年丙辰科
bio_short: 咸丰六年状元，同治、光绪两代帝师，晚清政坛"清流"领袖。历官户部尚书、军机大臣，戊戌变法前夕被开缺回籍，成为晚清政局转折的标志性事件。书法为一代名家。
tags:
  - 帝师
  - 书法家
  - 军机大臣
events:
  - year: 1856
    type: 夺魁
    title: 咸丰六年丙辰科状元
    description: 父翁心存官至大学士，兄翁同书为巡抚；翁氏为常熟望族，"一门四进士，两代三状元"之说起于此家（侄翁曾源同治二年亦夺魁）。
    source_id: s0002
    office: 翰林院修撰
    rank_grade: 6.5
    evidence: secondary
  - year: 1865
    type: 升迁
    title: 入值弘德殿，授同治帝读
    description: 自此开帝师生涯，前后教习同治、光绪二帝逾二十年。
    source_id: s0005
    office: 弘德殿行走（帝师），本官侍讲学士
    rank_grade: 4.5
    estimated: true
    evidence: secondary
  - year: 1882
    type: 升迁
    title: 入直军机处
    description: 后官至户部尚书、协办大学士，两度入军机，为光绪朝前期最有影响力的汉大臣之一。
    source_id: s0005
    office: 户部尚书、军机大臣
    rank_grade: 1.5
    evidence: secondary
  - year: 1898
    type: 贬谪
    title: 戊戌变法开幕即被开缺
    description: 光绪帝下《明定国是诏》后数日，翁同龢突遭开缺回籍，朝野震动，后世史家多以此事为变法命运之伏笔。
    source_id: s0005
    evidence: secondary
  - year: 1904
    type: 卒
    title: 卒于常熟故里
    description: 年七十五。其日记四十余册传世，为研究晚清政局的第一手史料。
    source_id: s0012
    evidence: secondary
