bio_short: 梓州铜山人。父苏协，后蜀进士。太平兴国五年举进士，太宗覆试，擢冠甲科，年二十二。累迁翰林学士，参与编文苑英华。淳化四年为参知政事。至道二年卒，年三十九，赠礼部尚书。
