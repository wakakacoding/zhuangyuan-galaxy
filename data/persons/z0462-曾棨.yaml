ke_ci: 永乐二年甲申科
bio_short: 永乐二年状元，「江西才子」。殿试廷对两万言不打草稿，此科吉安府包揽前七名，曾棨居首。官至詹事府少詹事，为太子师；任《永乐大典》副总裁。诗文雄健，草书雄放，性豪爽善饮，人称「醉学士」。
tags:
  - 两万言不打草稿
  - 永乐大典副总裁
  - 醉学士
events:
  - year: 1404
    type: 夺魁
    title: 永乐二年甲申科状元
    description: 殿试对策才思泉涌，廷对两万言不打草稿，成祖深赏，钦点第一。是科吉安府包揽前七名（状元曾棨、榜眼周述、探花周孟简、会元杨相等），为科举史罕见的「一府同榜」盛况。授翰林修撰。
    source_id: s0004
  - year_label: 永乐年间
    precision: range
    type: 升迁
    title: 侍读东宫，《永乐大典》副总裁
    description: 屡从成祖巡幸，参预机要文书；升詹事府少詹事，长期教导太子；受命为《永乐大典》副总裁，与解缙等同主这部三万七千卷的文化工程。
    office: 詹事府少詹事
    rank_grade: 4
    estimated: true
    source_id: s0004
  - year_label: 永乐—宣德年间
    precision: range
    type: 轶事
    title: 醉学士
    description: 性豪爽善饮，常与文人雅士聚会赋诗，人呼「醉学士」。草书雄放、笔法灵动；馆阁文臣皆推崇其才。有《西墅集》《巢睫集》传世。
    source_id: s0004
  - year: 1432
    type: 卒
    title: 宣德七年卒
    description: 年六十一。永丰明代文名之盛，曾棨为冠冕。
    source_id: s0004
