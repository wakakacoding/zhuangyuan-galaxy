events:
  - year: 1511
    type: 夺魁
    title: 正德六年殿试第一
    description: 《明史》本传记其年二十四举正德六年殿试第一，授翰林院修撰。
    source_id: s0034
    office: 翰林院修撰
    rank_grade: 6.5
  - year: 1524
    type: 贬谪
    title: 议礼伏阙，再杖后谪戍永昌
    description: 本传记其与廷臣伏左顺门力谏，撼门大哭，廷杖后十日再杖，与王元正、刘济并谪戍，杨慎得云南永昌卫。「国家养士百五十年，仗节死义，正在今日」见《明史》卷一百九十一，是号召伏阙之语，不是跪门时的呼喊。
    source_id: s0034
  - year_label: 嘉靖年间
    precision: range
    type: 著作
    title: 著作之富推为第一
    description: 本传说「明世记诵之博，著作之富，推慎为第一。诗文外，杂著至一百余种，并行于世」。未给具体年份，也不单指戍所所写。
    source_id: s0034
  - year: 1559
    type: 卒
    title: 嘉靖三十八年卒
    description: 本传记嘉靖三十八年七月卒，年七十二。追谥文宪在天启中，不是隆庆。
    source_id: s0034
