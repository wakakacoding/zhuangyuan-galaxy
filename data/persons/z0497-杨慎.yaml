events:
  - year: 1511
    type: 夺魁
    title: 正德六年辛未科状元
    description: 年二十四夺魁，授翰林院修撰。少年科第，士林瞩目。
    source_id: s0004
    office: 翰林院修撰
    rank_grade: 6.5
  - year: 1524
    type: 贬谪
    title: 大礼议伏阙哭谏，廷杖戍滇
    description: 率百官跪左顺门哭谏，大呼"国家养士百五十年，仗节死义，正在今日"。两遭廷杖，谪戍云南永昌卫，永不叙用。
    source_id: s0004
  - year_label: 嘉靖年间
    precision: range
    type: 著作
    title: 戍中著述等身
    description: 谪居云南三十五载，著述百余种，《升庵集》《廿一史弹词》行世。《临江仙》一词后借《三国演义》卷首而家喻户晓。
    source_id: s0004
  - year: 1559
    type: 卒
    title: 卒于永昌戍所
    description: 嘉靖三十八年卒于戍所，年七十二。隆庆间平反，追谥文宪。
    source_id: s0004
