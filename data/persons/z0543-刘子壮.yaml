events:
  - year: 1649
    type: 夺魁
    title: 顺治六年己丑科状元
    description: 顺治帝针对廷试对策八股套话滥行，明令该科不得用四六文俗套。刘子壮直陈利弊、朴茂沉雄，深合旨意；殿试策对主张民族和睦、省刑薄赋，大魁天下。授国史馆修撰。
    source_id: s0005
