ke_ci: 建隆元年庚申科
bio_short: 宋朝开国之科状元，史上第一位「宋状元」，《状元谱》称「关中千古唱首」。中第即遭父丧、数日水浆不入口；真宗为太子时问其及第年，默而不答，自悔失问。一生清苦，卒后真宗车驾进不了他所居狭巷，下车湿鞋步行至灵前，罢朝致哀。
tags:
  - 宋朝首位状元
  - 清苦名臣
events:
  - year: 960
    type: 夺魁
    title: 建隆元年庚申科状元
    description: 宋太祖开国首科，二月举进士，同榜二十四人，殿试一甲第一。出身世宦之家（曾祖杨守信官唐山南西道节度使、同平章事）。
    source_id: s0003
  - year_label: 建隆年间
    precision: range
    type: 轶事
    title: 父丧绝浆，辞官奉母
    description: 夺魁不久父病逝，悲痛数日水米不进；服除后以俸禄不足以养母为由闲居不仕，亲朋再三敦促乃赴凤州团练推官，岁余又以母疾弃官——孝行重于仕进。
    source_id: s0003
  - year: 976
    type: 升迁
    title: 开宝九年诣阙献书复出
    description: 召试学士院，授陇州防御推官，迁光禄寺丞；丁母忧后再起，转秘书丞、屯田员外郎，知鄂州以善政闻名。
    source_id: s0003
  - year_label: 至道年间（995 前后）
    precision: circa
    type: 轶事
    title: 真宗问「何年及第」，默而不答
    description: 赵恒为开封府尹时杨砺任推官，帝屡问何年及第，砺默而不答。后知其为开国状元，帝自悔失问，益重其不以科名自炫。
    source_id: s0003
  - year: 998
    type: 升迁
    title: 咸平元年拜翰林学士、知贡举
    description: 真宗即位，六十八岁高龄拜翰林学士主持贡举，旋拜工部侍郎，累至枢密副使。
    office: 枢密副使
    rank_grade: 2
    estimated: true
    source_id: s0003
  - year: 999
    type: 卒
    title: 咸平二年八月卒，年六十九
    description: 真宗叹「杨砺耿直清苦，正欲重用之时去世」，冒雨亲往吊唁；所居狭巷车驾不能入，帝下车步行至灵前。罢朝致哀，追赠兵部尚书。有文集二十卷。
    source_id: s0003
