name: 李騏
zi: 德良
dynasty: ming
exam_year: 1418
reign: 永乐十六年
native_hist: 福建福州府长乐县
native_modern: 福建省福州市长乐区
birth_year: 1378
death_year: 1425
ke_ci: 永乐十六年戊戌科
bio_short: 永乐十六年状元，本名李马——成祖嫌状元以牲畜为名不吉，御笔在「马」旁添「其」，赐名李騏。他与马铎是同母异父兄弟：母亲王梦蛟先适马家生马乐（马铎），改嫁李家生李马——「一母两状元」，千古奇闻。以孝闻名，闻成祖驾崩带病哭灵，半年后连遭继母、妻子之丧，旋卒于家。
tags:
  - 一母两状元
  - 御笔改名
events:
  - year: 1417
    type: 中举
    title: 永乐十五年福建乡试第一
    description: 长乐沙京人，与马铎同师从陈洵仁，读书于六平山东溪精舍。丁酉科乡试解元，次年联捷状元。
    source_id: s0033
  - year: 1418
    type: 夺魁
    title: 永乐十六年戊戌科状元，御笔改名
    description: 廷试一甲第一。成祖嫌「李马」之名不雅，亲以朱笔于「马」旁加「其」字，赐名李騏，授翰林院修撰。「首石鸣则大魁出，明永乐间再鸣，而马铎、李騏相继抡元」——长乐首石山因此留名。
    source_id: s0033
  - year: 1424
    type: 轶事
    title: 闻国丧，带病哭灵
    description: 永乐二十二年成祖驾崩，李騏正染病，闻讯带病哭灵，病势转重；半年之内又连遭继母与妻子之丧。
    source_id: s0033
  - year: 1425
    type: 卒
    title: 洪熙元年卒于家，年四十八
    description: 以孝行闻名乡里，葬长乐沙京龙窟山。翰林杨荣为其撰墓志铭。
    source_id: s0033
career:
