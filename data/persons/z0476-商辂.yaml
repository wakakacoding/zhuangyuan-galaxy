    source_id: s0004
    evidence: secondary
  - year: 1445
    type: 夺魁
    title: 正统十年乙丑科状元，连中三元
    description: 会试、殿试连捷第一，成就明代唯一获官方完整承认的三元及第。
    source_id: s0004
    office: 翰林院修撰
    rank_grade: 6.5
    evidence: secondary
  - year: 1449
    type: 升迁
    title: 土木之变后入阁
    description: 英宗被俘，郕王监国，商辂入阁预机务，支持于谦坚守北京，反对南迁。
    source_id: s0004
    office: 翰林院侍读、入阁预机务
    rank_grade: 6
    estimated: true
    evidence: secondary
  - year: 1457
    type: 贬谪
    title: 夺门之变后削籍为民
    description: 英宗复辟，石亨、徐有贞诬陷忠良，商辂被革职回乡，家居十年。
    source_id: s0004
    evidence: secondary
  - year: 1467
    type: 升迁
    title: 成化三年召复入阁
    description: 宪宗即位后召还，复职入阁；后官至吏部尚书兼谨身殿大学士，为成化名相。
    source_id: s0004
    office: 吏部尚书兼谨身殿大学士
    rank_grade: 2
    estimated: true
    evidence: secondary
  - year: 1486
    type: 卒
    title: 成化二十二年卒
    description: 谥文毅。淳安至今存"三元坊"遗迹。
    source_id: s0004
    evidence: secondary
