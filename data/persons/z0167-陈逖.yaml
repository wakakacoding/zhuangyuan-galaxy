ke_ci: 贞明四年戊寅科
bio_short: 后梁贞明四年状元，泉州文庙「皂荚结荚」传说的主角，闽南文献可查的早期状元。乱世仕梁，上疏谏末帝振作不纳，随军复潞州以功授检校司空；遭权臣赵岩排挤，贬雷州推官，抱憾归隐三十年，卒谥文端。
tags:
  - 闽南状元
  - 皂荚传说
  - 乱世直臣
events:
  - year: 918
    type: 夺魁
    title: 后梁贞明四年状元
    description: 末帝在位十一年间八次科考仅知此科状元一人；是年取进士十二人。《登科记考》卷二十五引《玉芝堂谈荟》载「贞明中状元陈逖」，附此俟考。
    source_id: s0001
  - year_label: 贞明年间
    precision: range
    type: 轶事
    title: 皂荚结荚之兆
    description: 《太平广记》引《稽神录》：泉州文宣王庙庭有皂荚树，州人将登第则生一荚。贞明中忽生一荚半——是年陈逖进士及第（状元），黄仁颖止明经；后同光中黄仁颖再试夺魁，「半荚成全荚」。泉州府志、晋江县志均载此传说。
    source_id: s0021
  - year_label: 贞明—龙德年间
    precision: range
    type: 升迁
    title: 历礼部员外郎、郎中、翰林承旨
    description: 为丞相敬翔所荐辟，入汴京授编撰，上疏谏末帝「毋深居殿阁，宜振作收复失地」，不纳。后随安元信救上党、破夹寨、复潞州，以功授检校司空。
    office: 检校司空
    rank_grade: 1.5
    estimated: true
    source_id: s0022
  - year: 922
    type: 贬谪
    title: 龙德二年遭排挤，抱憾归隐
    description: 权臣赵岩操弄朝政，陈逖被贬雷州推官；是年十二月称病辞官，归晋江隐居。家居三十年，尝以俸禄周济乡里受灾贫苦农户。
    source_id: s0022
  - year: 952
    type: 卒
    title: 广顺二年十一月卒于家
    description: 卒年六十三，赐谥文端。著有《田远诗话》五卷（佚）。
    source_id: s0022
