ke_ci: 雍熙二年乙酉科
bio_short: 雍熙二年状元，夺魁之日长子梁固出生——二十四年后父子先后夺魁，成就史上唯一「父子状元」佳话。词辩明敏、有吏才，四十二岁暴卒于开封知府任上。《三字经》「若梁灏，八十二，对大廷，魁多士」其实是讹传——他夺魁时只有二十三岁。
tags:
  - 父子状元
  - 三字经辨伪
  - 早逝
events:
  - year: 985
    type: 夺魁
    title: 雍熙二年乙酉科状元
    description: 年二十三。少年丧父由叔父抚育，师从王禹偁之门（一说名家王禹偁辈）。夺魁当日，长子梁固出生。后世《三字经》及《遁斋闲览》「八十二岁状元」说均为讹传，《宋史》本传明载其寿止四十二。
    source_id: s0003
  - year_label: 太宗至真宗朝
    precision: range
    type: 升迁
    title: 翰林学士，同修《太祖实录》
    description: 历大名府观察推官入朝，与杨砺、朱台符、李若拙同掌贡举，与钱若水等修《太祖实录》及《起居注》。每上朝进奏，词辩明敏、见地高远，真宗凡百官奏章多先交其审核把关。
    office: 翰林学士
    rank_grade: 4.5
    estimated: true
    source_id: s0003
  - year: 1004
    type: 卒
    title: 景德元年暴病卒于开封知府任上
    description: 年四十二。开封知府为北宋最重要地方官，寇准、包拯、范仲淹皆历此任——梁灏若不死，宰辅可期。有文集十五卷。
    office: 权知开封府
    rank_grade: 3.5
    estimated: true
    source_id: s0003
  - year: 1009
    type: 轶事
    title: 子梁固夺魁，「父子状元」坊
    description: 大中祥符二年，长子梁固进士第一。东平后人建「父子状元」坊，清康煕重修石坊楹联：「是父是子同作状头千载少，为卿为相流传历代一门多。」第三子梁适后官至宰相。
    source_id: s0003
