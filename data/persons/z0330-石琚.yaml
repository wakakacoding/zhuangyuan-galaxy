id: z0330
name: 石琚
zi: 子美
dynasty: jin
exam_year: 1139
reign: 天眷二年己未科
native_hist: 定州（今河北定縣）
native_modern: 河北省保定市唐县（金定州）
birth_year: 1111
death_year: 1182
ke_ci: 天眷二年己未科
bio_short: 金朝开国第二位状元，辅佐「小尧舜」金世宗成就大定之治的第一名相。县令任上「出淤泥而不染」，吏部十年知人善任；世宗每事必先咨石琚而后定，「唯石琚能知人」。官至右丞相，封莘国公，卒后图形衍庆宫、配享世宗庙庭。
tags:
  - 大定之治
  - 金代名相
  - 配享庙庭
events:
  - year: 1139
    type: 夺魁
    title: 天眷二年己未科状元
    description: 天眷元年金熙宗诏以经义、词赋两科取士——金朝第一次全国统一科考。石琚次年进京殿试，高中进士第一。七岁读书过目成诵，博通经史。
    source_id: s0008
  - year_label: 皇统—正隆年间
    precision: range
    type: 升迁
    title: 县令清廉，「虽一毫而不取」
    description: 任弘政、邢台县令。郡守贪暴、上行下效，唯石琚出污泥而不染；郡守事败诬属下同罪，石琚以廉自辩得免，改秀容县令，召为左司都事，累迁吏部郎中。
    source_id: s0008
  - year: 1162
    type: 升迁
    title: 大定二年上疏六事，迁吏部尚书
    description: 贞元末任吏部侍郎；世宗即位升左谏议大夫，上疏「正纪纲、明赏罚、近忠直、远邪佞、省不急之务、罢无名之役」六事，悉得采纳。在吏部十年，政绩显著，世宗屡欲拜参知政事，石琚力辞三次不获准。
    office: 吏部尚书
    rank_grade: 3
    estimated: true
    source_id: s0008
  - year: 1177
    type: 升迁
    title: 大定十七年拜平章政事，次年右丞相
    description: 历参知政事、尚书右丞、左丞兼太子少师，大定十七年拜平章政事、封莘国公，十八年升右丞相。世宗尝言「知人为难事，惟石琚为相，往往举能为官」；大小政事必先咨询而后定。
    office: 右丞相
    rank_grade: 1.5
    estimated: true
    source_id: s0008
  - year: 1182
    type: 卒
    title: 大定二十二年卒，谥文宪
    description: 大定十九年致仕归乡，二十二年六月病逝家中，年七十二，谥文宪。泰和元年（1201）章宗诏图形衍庆宫，配享世宗庙庭——金代人臣之极哀荣。
    source_id: s0008
