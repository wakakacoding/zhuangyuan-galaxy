id: z0553
name: 蔡启僔
zi: 硕公（一字石公）
hao: 昆旸
dynasty: qing
exam_year: 1670
reign: 康熙九年
native_hist: 浙江省湖州府德清县
native_modern: 浙江省湖州市德清县
birth_year: 1619
death_year: 1683
ke_ci: 康熙九年庚戌科
bio_short: 康熙九年状元，德清蔡氏「一门三状元」之首。年过半百、家道中落后赴京赶考，途经淮安被势利同年冷落，愤而苦读夺魁，题诗「寄语山阳贤县令，查明须向榜头看」——科场版「范叔寒」。康熙十一年主考顺天乡试「得人最盛」。
tags:
  - 德清蔡氏
  - 一门三状元
events:
  - year: 1670
    type: 夺魁
    title: 康熙九年庚戌科状元，年五十二
    description: 父蔡奕琛为明末清初礼部尚书兼文渊阁大学士。蔡启僔屡试不第，康熙八年北上赴考，路过山阳拜县令同年遭冷遇，发愤苦读，次年夺魁。拒收邵县令厚礼，题诗「一肩行李上长安，风雪谁怜范叔寒？寄语山阳贤县令，查明须向榜头看。」
    source_id: s0005
  - year: 1672
    type: 升迁
    title: 康熙十一年主考顺天乡试
    description: 授翰林院修撰，清初设日讲官即以启僔补。主考顺天乡试力除时弊，「得人最盛」。历右春坊、右赞善，博学多才，精天人理数，擅书法，著《燕游草》《存园集》《洪范五行传》等。
    office: 日讲官、顺天乡试主考
    rank_grade: 5
    estimated: true
    source_id: s0005
  - year: 1683
    type: 卒
    title: 康熙二十二年卒
    description: 后以翰林院检讨病退归乡。十二年后（1682），嫡侄蔡升元夺魁；乾隆二十二年（1757）族裔蔡以台再中状元——德清蔡氏「一门三状元」。
    source_id: s0005
