  - year: 972
    type: 夺魁
    title: 开宝五年壬申科状元
    description: 父安德裕三年前（969）夺魁，安守亮紧随其后再登榜首，世称「父子状元」。家本河南显贵，经祖父安重荣叛败之变后，以科第重振门声。
    source_id: s0018
