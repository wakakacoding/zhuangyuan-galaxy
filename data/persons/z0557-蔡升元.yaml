bio_short: 康熙二十一年状元，蔡启僔嫡侄——传胪诗自矜「君恩独被臣家沐，十二年间两状元」。康熙帝两次赐第，南巡嘉兴迎驾奏对如流；官至礼部尚书。德清蔡氏三状元中仕宦最显者。
