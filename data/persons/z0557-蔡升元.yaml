  - year: 1682
    type: 夺魁
    title: 康熙二十一年壬戌科状元
    description: 叔蔡启僔 1670 年夺魁，十二年后蔡升元继之。《纪恩集》传胪诗：「八对彤廷策万言，句胪高唱帝临轩。君恩独被臣家沐，十二年间两状元。」
    source_id: s0005
  - year_label: 康熙年间
    precision: range
    type: 升迁
    title: 入直南书房，官至礼部尚书
    description: 授翰林院修撰，入直南书房，历中允、少詹事、詹事，迁内阁学士，擢左都御史，终礼部尚书。康熙四十二年帝南巡，升元于嘉兴迎驾，奏对如流；帝两次赐第，恩遇罕见。
    office: 礼部尚书
    rank_grade: 2
    estimated: true
    source_id: s0005
  - year: 1722
    type: 卒
    title: 康熙六十一年卒
    description: 子蔡成龙娶大学士张鹏翮孙女与衍圣公孔毓圻外孙女——科名、宦途、婚姻皆一时之选。著《使秦草》。
    source_id: s0005
