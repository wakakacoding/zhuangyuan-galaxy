    type: 夺魁
    title: 光绪三十年甲辰恩科状元
    description: 家境贫寒，由保定莲池书院院长吴汝纶资助进京赶考而夺魁。此为科举史上最后一科殿试。
    source_id: s0002
  - year: 1904
    type: 授官
    title: 授翰林院修撰
    description: 次年（1905年）清廷诏废科举，刘春霖遂成末代状元，后赴日本法政大学短期留学。
