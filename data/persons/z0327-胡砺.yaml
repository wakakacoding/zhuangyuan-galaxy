id: z0327
name: 胡砺
zi: 元化
dynasty: jin
exam_year: 1132
reign: 天會十年
native_hist: 磁州(今河北武安市)
native_modern: 河北省邯郸市武安市
birth_year: 1107
death_year: 1161
ke_ci: 天会十年壬子科
bio_short: 金代北方文宗，武安史上唯一状元。少年被金兵掳掠，逃亡香山寺遇参知政事韩昉收教成名。其文舒卷自如，世称「元化格」，举子奉为考场范文；朝廷典章诏册多出其手。海陵王升平章，百官跪贺，唯胡砺不跪：「朝服之跪，面君之礼也」——刚直反而更被倚重。
tags:
  - 元化格
  - 不跪权臣
  - 七朝元老
events:
  - year: 1132
    type: 夺魁
    title: 天会十年状元，年二十五
    description: 早年金兵南下被掳至燕都，逃亡香山寺，遇参知政事韩昉，韩昉奇其才，令与己子同学，常对人言「胡生必闻名于世」。天会十年果夺魁。
    source_id: s0008
  - year_label: 天会—皇统年间
    precision: range
    type: 升迁
    title: 定州督学，文成「元化格」
    description: 授右拾遗、权翰林修撰，转定州观察判官。定州州学为河朔之冠，胡砺督教不倦，门生皆成各校骨干；其文章与考场范文被士子争仿，号「元化格」。
    office: 定州观察判官
    rank_grade: 7
    estimated: true
    source_id: s0008
  - year_label: 海陵朝
    precision: range
    type: 轶事
    title: 百官跪贺，独胡砺不跪
    description: 完颜亮（海陵王）升平章政事，诸官朝服跪贺，胡砺独不跪：「朝服而跪，见君之礼，岂可施于大臣！」反问责诸官「尔等为何屈膝违礼」。海陵敬其刚正，此后常托以要事。
    source_id: s0008
  - year_label: 正隆年间
    precision: range
    type: 升迁
    title: 同知深州，尽罢无赖弓手
    description: 深州五县向设捕盗弓手百余人，皆市井无赖，名为捕盗实为强盗，岁敛民财数千万。胡砺到任悉数解除，百姓称快；无赖匿名恐吓「某日杀守官」，他笑曰「我素贫，开门揖盗何妨」，洞开府门竟安然无事。
    source_id: s0008
  - year: 1161
    type: 卒
    title: 从海陵南征，病卒南京
    description: 官至刑部尚书、翰林学士（掌制诰，预修国史，兼太乐令考正音律）。正隆六年随海陵王南征至南京（今开封），病笃，海陵日遣人探视，七月卒，年五十五，葬武安故籍。
    source_id: s0008
career:
  first_office: 右拾遗、权翰林修撰
  first_category: 学政文教
  mid_office: 同知深州军州事
  mid_category: 地方
  final_office: 刑部尚书、翰林学士
  final_category: 部院高官
