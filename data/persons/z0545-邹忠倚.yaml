bio_short: 顺治九年汉榜状元——是科仿元制分满汉两榜，满榜为麻勒吉。邹忠倚上一科进士殿试不第，发愤三年终夺魁，是清朝第一个「补考状元」。惜夺魁两年即病卒，年三十二。
