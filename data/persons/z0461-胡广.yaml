ke_ci: 建文二年庚辰科
bio_short: 建文二年状元——殿试原定王艮第一，因貌不扬被黜，胡广以文中「亲藩陆梁，人心摇动」一语被建文帝拔为榜首，赐名胡靖。靖难兵入金陵，王艮饮毒殉国，胡广与解缙迎附；此后成为永乐朝文渊阁大学士、内阁首辅，随驾北征、帐殿论治，奉敕主持编修《四书大全》《五经大全》《性理大全》。
tags:
  - 内阁首辅
  - 迎附与殉国
  - 三朝《大全》
events:
  - year: 1400
    type: 夺魁
    title: 建文二年庚辰科状元
    description: 试官议定王艮夺魁，建文帝以王艮其貌不扬黜为榜眼；胡广策文有「亲藩陆梁，人心摇动」语，切中时局，被钦点第一甲第一名，赐名靖，授翰林修撰。此科吉安包揽一甲三人（状元胡广、榜眼王艮、探花李贯）。
    source_id: s0004
  - year: 1402
    type: 轶事
    title: 靖难之变：「一猪都舍不得」
    description: 燕军破应天，王艮、胡靖、解缙、吴溥四人聚会，胡、解慷慨陈词，独王艮哭泣不言。吴溥断言惟王艮殉死，言未竟，闻胡靖呼家人「外面喧闹，小心看好猪」——吴溥叹：「一猪尚舍不得，肯舍性命乎？」不久王艮饮毒殉建文，胡靖、解缙迎附朱棣。
    source_id: s0004
  - year_label: 永乐年间
    precision: range
    type: 升迁
    title: 文渊阁大学士，内阁首辅
    description: 历侍讲、侍读、右春坊右庶子入内阁，永乐五年翰林学士兼左春坊大学士。成祖北征，与杨荣、金幼孜扈从，帐殿论治常至深夜；善书法，勒石刻碑皆命其书；军中为皇孙朱瞻基讲经史。十四年进文渊阁大学士；谏阻封禅，呈《却封禅颂》。
    office: 文渊阁大学士
    rank_grade: 1.5
    estimated: true
    source_id: s0004
  - year_label: 永乐年间
    precision: range
    type: 著作
    title: 主持编修《四书大全》等三部《大全》
    description: 奉敕主持编修《四书大全》《五经大全》《性理大全》，为明代官学教科书体系奠基。
    source_id: s0004
  - year: 1418
    type: 卒
    title: 永乐十六年卒，谥文穆
    description: 做事缜密，于帝前所闻出不以告人；尝奏郡县穷治建文奸党株连太广，帝纳其言。成祖曾命其以女许解缙之子解祯亮，解家败后胡广欲解约，其女割耳明志「毁约惟死」，终成婚——一诺重于门楣。卒谥文穆（南明弘光时夺谥）。
    source_id: s0004
