  - year: 1029
    type: 夺魁
    title: 太平九年己巳科状元
    description: 是年八月渤海人大延琳于东京（今辽阳）反辽，张仁纪等协助张杰守沈州；乱平之后，圣宗赐张仁纪等进士及第，以褒其忠——科举与军功在此科合流。
    source_id: s0017
