    type: 轶事
    title: 父安重荣叛败，幼为秦习所养
    description: 安重荣后晋时官成德军节度使，举兵反叛败亡。安德裕幼年被将官秦习收养改姓秦；自小爱笔砚，见文字即诵读，通文史，尤精《礼记》《左传》《汉书》，后复本姓。
    source_id: s0018
  - year: 969
    type: 夺魁
    title: 开宝二年己巳科状元
    description: 以叛臣之后登进士第一，宋初取士不拘门第之证。
    source_id: s0003
  - year: 972
    type: 轶事
    title: 子安守亮隔科夺魁
    description: 开宝五年，子安守亮进士第一，距父状元仅三年、隔两科，世称「父子状元」。
    source_id: s0018
