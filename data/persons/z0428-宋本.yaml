ke_ci: 至治元年辛酉科（左榜）
bio_short: 至治元年左榜状元——四十岁大器晚成。任监察御史以敢言名动朝野：劾铁失余党、追太庙神主失盗、斥宰执壅滞机务、抗言蒙古千户夺民女案；反对为罪臣复官，不惜称病挂冠。文宗朝复出，首开代祀妈祖天妃之使；其知贡举取士满百人额、增一甲为三人，遗泽后世。与弟宋褧并称「大都二宋」。
tags:
  - 左榜状元
  - 敢言御史
  - 大都二宋
events:
  - year: 1321
    type: 夺魁
    title: 至治元年辛酉科左榜状元
    description: 自幼颖拔，读书穷日夜，句探字索必通贯乃已；随父官江陵，从王奎文问性命义理之学，年四十始还燕。廷试第一，授翰林国史院修撰。
    source_id: s0009
  - year: 1324
    type: 升迁
    title: 泰定元年除监察御史，以敢言称
    description: 首劾逆贼铁失余党阿散「身亲弑逆，乞早正天讨」；仁宗神主被盗，劾太常失典守；劾中书宰执固宠苟安、壅滞机务；蒙古千户夺民女，权贵庇护不问，宋本抗言「铁失余党未诛、神主盗未得、朱甲冤未伸，灾异之见，职此之由」——辞气激奋，众皆耸听。
    office: 监察御史
    rank_grade: 7
    estimated: true
    source_id: s0009
  - year_label: 泰定年间
    precision: range
    type: 贬谪
    title: 反对擢用罪臣，称病不出
    description: 左丞相倒剌沙当国，拟为宪台夺官者（多出其门）复官并酬西域贾人献物之直，宋本力争「形诸王言，必贻笑天下」「以后再有奸贼还整治不整治？」诏竟准，宋本遂称病不复出任。
    source_id: s0009
  - year: 1329
    type: 轶事
    title: 首开代祀天妃之使
    description: 文宗即位复起，历吏部侍郎、礼部侍郎、奎章阁艺文监检校书籍大监。天历二年奉旨与翰林直学士布尼雅锡哩自北而南代祀海神天妃（妈祖）——朝廷遣使祀妈祖自此始，虞集、马祖常等皆赋诗送行。
    source_id: s0009
  - year: 1334
    type: 卒
    title: 元统二年冬卒于官，年五十四
    description: 官至礼部尚书、集贤直学士兼国子祭酒。知贡举取进士满百人额，为读卷官增一甲至三人。卒谥正献，赠范阳郡侯。著《至治集》四十卷，古文峻洁刻厉。弟宋褧亦进士，文学齐名，人称「大都二宋」。
    source_id: s0009
