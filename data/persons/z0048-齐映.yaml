    type: 升迁
    title: 入令狐彰幕府，掌书记
    description: 令狐彰病重时，齐映劝他把儿子送回京师、请朝廷另派节度使。彰从其言，并以女妻之。
    source_id: s0047
    evidence: primary
  - year: 786
    type: 升迁
    title: 拜中书侍郎、同平章事
    description: 封河间县男。
