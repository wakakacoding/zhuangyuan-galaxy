  - year: 787
    type: 贬谪
    title: 贬夔州刺史
    description: 与张延赏不睦，出为夔州刺史，后转衡州、江西观察使。
    source_id: s0047
    evidence: secondary
  - year: 795
    type: 卒
    title: 贞元十一年七月卒
    description: 年四十八，赠礼部尚书。谥忠，一说恭懿，谥号未核到原文，不写入。
    source_id: s0047
