bio_short: 字润甫，小名海子，定州安喜人。祖父崔仁师官至中书侍郎，兄崔湜官至中书令。工五言诗，《上元夜》《踏歌词》写尽长安灯夜繁华。登进士第后官至殿中侍御史；先天二年兄崔湜以谋逆赐死，崔液亡命郢州作《幽征赋》，遇赦北还，病死途中——繁华词人终成乱局陪葬。
tags:
  - 五言名家
  - 崔湜之弟
  - 幽征赋
disputed: true
dispute_note: 「举进士第一」见《唐诗大辞典》引诸书，名录系景云三年（712）；但及第年份正史无载，诸家辞典亦注「及第时间无考」，系年存疑。
events:
  - year: 712
    type: 夺魁
    title: 进士第一（名录系景云三年壬子科）
    description: 崔湜尝叹服其诗才，呼其小名曰「海子，我家龟龙也」。及第年份无正史明文。
    source_id: s0018
  - year_label: 先天元年（712）前
    precision: range
    type: 升迁
    title: 历监察御史、殿中侍御史、吏部员外郎
    description: 袭封安平县男，官至殿中侍御史。诗作《上元夜》「玉漏银壶且莫催，铁关金锁彻明开」、《踏歌词》传写宫廷夜宴，盛传一时。
    office: 殿中侍御史
    rank_grade: 7.5
    estimated: true
    source_id: s0007
  - year: 713
    type: 贬谪
    title: 崔湜案起，亡命郢州
    description: 先天二年，兄崔湜以与太平公主谋逆获罪，流放岭南途中赐死。崔液惧祸，改名换姓匿于郢州胡履虚家，途中作《幽征赋》以见意，词甚典丽。
    source_id: s0007
  - year: 714
    type: 卒
    title: 遇赦北还，道病卒
    description: 开元二年大赦，崔液启程返京，病死于途，年约四十。友人裴耀卿纂其遗文为《崔液集》十卷（已佚），《全唐诗》存诗十二首。
    source_id: s0007
