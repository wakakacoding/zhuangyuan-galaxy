id: z0271
name: 王棠
dynasty: liao
exam_year: 1046
reign: 重熙十五年丙戌科
native_hist: 涿州新城（今河北新城縣）
native_modern: 河北省保定市（涿州新城，今高碑店市一带）
death_year: 1094
ke_ci: 重熙十五年丙戌科
bio_short: 辽兴宗重熙十五年状元——乡贡、礼部、廷试三试皆第一，辽代的「连中三元」。历上京盐铁使、东京户部使；大康二年辽东大饥，力请赈济活民无数；大康三年入为枢密副使、拜南府宰相。《辽史》入「能吏传」：为政练达，法度修明，舆论评价极高。
tags:
  - 辽代三元
  - 能吏
  - 赈灾
events:
  - year: 1046
    type: 夺魁
    title: 重熙十五年丙戌科状元，三试皆第一
    description: 乡贡、礼部、廷试三级考试全部第一，为辽代罕见的「连中三元」式状元。擅长史、文学。
    source_id: s0017
  - year_label: 道宗大康初
    precision: circa
    type: 升迁
    title: 盐铁使蒙冤，查无实证获释
    description: 任上京盐铁使时因受贿嫌疑被捕，经查无实证获释，改任东京户部使——《辽史》直言其事而不讳，反见其「能吏」本色。
    office: 东京户部使
    rank_grade: 4
    estimated: true
    source_id: s0017
  - year: 1076
    type: 升迁
    title: 大康二年辽东大饥，力主赈济
    description: 辽东饥荒、民众大量饿死，王棠请赈获批准，活人甚众。次年（1077）入京为枢密副使，拜南府宰相。
    office: 枢密副使、南府宰相
    rank_grade: 2
    estimated: true
    source_id: s0017
  - year: 1094
    type: 卒
    title: 大安十年卒
    description: 《辽史》卷九十七「能吏传」定论：为政练达，处理事务勤勉不怠，法度修明，舆论评价很高。
    source_id: s0017
