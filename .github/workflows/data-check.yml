name: Data Check

# 保留为数据变更的快速检查。它不是发布资格：发布只认 Release gate。
on:
  pull_request:
    paths: ['data/**', 'scripts/**', 'src/lib/schema.ts']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:data
      - run: npm run build:data
