name: Release gate

# 数据检查、类型检查、完整构建都过，才产出可部署制品；制品与部署同属本次运行，
# 因此「测试的 commit = 构建的 commit = 部署的 commit」由同一次 run 保证。
# 失败时 gate 退出码非零 → deploy 因 needs 被跳过，不会部署。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:data
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          GITHUB_ACTIONS: true
      - name: Stamp build identity
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const stats = JSON.parse(readFileSync('public/data/stats.json','utf8'));
            const stamp = {
              commit: process.env.GITHUB_SHA,
              data_build_date: stats.build_date,
              stats_version: stats.version,
              built_at: new Date().toISOString(),
            };
            writeFileSync('dist/build-stamp.json', JSON.stringify(stamp, null, 2));
            console.log(JSON.stringify(stamp));
          "
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # 部署必须与构建同一次运行：actions/deploy-pages@v4 只读取**本次运行**的
  # github-pages 制品（源码 api-client.js：No artifacts named "github-pages"
  # were found for this workflow run）。跨 run 用 workflow_run 取不到制品。
  deploy:
    needs: gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
